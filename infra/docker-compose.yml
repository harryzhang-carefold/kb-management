# ============================================================
# kb-management — 基础设施编排
# 使用本地已有镜像（registry 拉取受限）:
#   postgres:15-alpine / elasticsearch:8.11.3 / pgsty/minio
# 新建: PostgreSQL / Elasticsearch / MinIO
# 复用: 现有 redis 容器 (127.0.0.1:6179) 作为 Celery broker
# ============================================================

services:
  # ----------------------------------------------------------
  # PostgreSQL 15 — 关系数据
  # ----------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: kb-pg
    restart: unless-stopped
    ports:
      - "9011:5432"
    environment:
      POSTGRES_USER: ${PG_USER:-kb_admin}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-kb_password_2026}
      POSTGRES_DB: ${PG_DB:-kb_management}
    volumes:
      - kb_pg_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-kb_admin} -d ${PG_DB:-kb_management}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - kb-net

  # ----------------------------------------------------------
  # Elasticsearch 8.11 — 全文 + 向量（混合检索）
  # ----------------------------------------------------------
  elasticsearch:
    image: elasticsearch:8.11.3
    container_name: kb-es
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=kb-es
    volumes:
      - kb_es_data:/usr/share/elasticsearch/data
      - kb_es_plugins:/usr/share/elasticsearch/plugins
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 24
      start_period: 60s
    networks:
      - kb-net

  # ----------------------------------------------------------
  # MinIO (pgsty/minio fork) — 对象存储（S3 兼容）
  # ----------------------------------------------------------
  minio:
    image: pgsty/minio:RELEASE.2026-03-25T00-00-00Z
    container_name: kb-minio
    restart: unless-stopped
    command: server /data --console-address ":9003"
    ports:
      - "9002:9000"   # S3 API
      - "9004:9003"   # Web Console (9003 被 leafcore-backend 占用，改用 9004)
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-kb_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-kb_minio_2026}
    volumes:
      - kb_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - kb-net

  # ----------------------------------------------------------
  # MinerU 文档解析服务（纯 CPU）
  # 单独启用: docker compose --profile mineru up -d mineru
  # 模型首次启动自动下载 ~2GB（卷持久化）
  # ----------------------------------------------------------
  mineru:
    build:
      context: .
      dockerfile: mineru.Dockerfile
    image: kb-mineru-cpu:latest
    container_name: kb-mineru
    profiles: ["mineru"]
    restart: unless-stopped
    ports:
      - "9030:8000"   # FastAPI 解析接口
    environment:
      - MINERU_MODEL_SOURCE=modelscope
      - MINERU_DEVICE_MODE=cpu
    volumes:
      - kb_mineru_models:/models
    shm_size: 4g
    deploy:
      resources:
        limits:
          memory: 8g
    networks:
      - kb-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

# ============================================================
# 数据卷
# ============================================================
volumes:
  kb_pg_data:
  kb_es_data:
  kb_es_plugins:
  kb_minio_data:
  kb_mineru_models:

# ============================================================
# 网络
# ============================================================
networks:
  kb-net:
    driver: bridge
